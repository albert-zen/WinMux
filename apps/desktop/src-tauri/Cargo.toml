[package]
name = "cmux-win-desktop"
version = "0.1.0"
description = "Windows-first desktop shell for cmux-win"
authors = ["Codex"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cmux_win_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-events = { path = "../../../crates/core-events" }
core-ipc = { path = "../../../crates/core-ipc" }
core-layout = { path = "../../../crates/core-layout" }
core-notify = { path = "../../../crates/core-notify" }
core-session = { path = "../../../crates/core-session" }
core-state = { path = "../../../crates/core-state" }
core-theme = { path = "../../../crates/core-theme" }
dirs = "6"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
