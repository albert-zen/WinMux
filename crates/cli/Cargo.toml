[package]
name = "cmux-win-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cmux-win"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }
